<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="110" />
    </clipPath>
    <clipPath id="flagClip">
      <path d="M 256 340 L 512 340 L 512 512 L 256 512 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- App Icon Background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Book Background / Pages -->
    <path d="M 100 170 C 100 170 170 150 256 180 C 342 150 412 170 412 170 L 412 380 C 412 380 342 360 256 390 C 170 360 100 380 100 380 Z" fill="#f8fafc" />
    
    <!-- Center line of the book -->
    <line x1="256" y1="180" x2="256" y2="390" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <!-- Letters AV -->
    <text x="256" y="310" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#1e40af" text-anchor="middle" letter-spacing="-5">AV</text>
    
    <!-- Arrow -->
    <path d="M 340 200 L 390 160 L 400 230 Z" fill="#10b981" />
    <line x1="320" y1="260" x2="370" y2="190" stroke="#10b981" stroke-width="16" stroke-linecap="round" />

    <!-- UK Flag Bottom Right -->
    <g clip-path="url(#flagClip)">
      <!-- Flag Background -->
      <rect x="256" y="340" width="256" height="172" fill="#012169" />
      
      <!-- White Diagonals -->
      <line x1="256" y1="340" x2="512" y2="512" stroke="#ffffff" stroke-width="24" />
      <line x1="256" y1="512" x2="512" y2="340" stroke="#ffffff" stroke-width="24" />
      
      <!-- Red Diagonals -->
      <line x1="256" y1="340" x2="512" y2="512" stroke="#C8102E" stroke-width="10" />
      <line x1="256" y1="512" x2="512" y2="340" stroke="#C8102E" stroke-width="10" />
      
      <!-- White Cross -->
      <line x1="384" y1="340" x2="384" y2="512" stroke="#ffffff" stroke-width="32" />
      <line x1="256" y1="426" x2="512" y2="426" stroke="#ffffff" stroke-width="32" />
      
      <!-- Red Cross -->
      <line x1="384" y1="340" x2="384" y2="512" stroke="#C8102E" stroke-width="20" />
      <line x1="256" y1="426" x2="512" y2="426" stroke="#C8102E" stroke-width="20" />
    </g>
  </g>
</svg>
